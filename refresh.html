<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Обновление TIIN</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#f5f2e9;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:330px;padding:28px;text-align:center}.mark{font-size:42px}.muted{color:#aab2c5;line-height:1.5}.spin{width:24px;height:24px;border:3px solid #303a50;border-top-color:#d4af5a;border-radius:50%;margin:22px auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(1turn)}}</style></head><body><main class="card"><div class="mark">TIIN</div><h1>Обновляем приложение</h1><p class="muted">Ваши операции, цели и данные входа не удаляются. Очищается только устаревший кэш интерфейса.</p><div class="spin"></div><p id="status" class="muted">Загружаем свежую версию…</p></main><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}document.getElementById('status').textContent='Готово. Открываем свежую версию…';setTimeout(()=>location.replace('./?updated=60'),500);}catch(e){document.getElementById('status').textContent='Нажмите сюда, чтобы открыть свежую версию.';document.getElementById('status').onclick=()=>location.replace('./?updated=60');}})();</script></body></html>
